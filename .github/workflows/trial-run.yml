################################################################
# TRIAL RUN (phase 0)
#   Runs the OSS Review Toolkit (ORT) on one public repository at
#   one ref, to see what it finds before Legattice builds on it:
#   1 analyze  -- every package of the enabled package managers
#   2 scan     -- ScanCode over the sources of every package
#                 (optional: hours for a large product)
#   3 report   -- CycloneDX SBOM, plain-text notices, web report
#   ORT is a separate program (Apache-2.0), run from its container
#   image pinned by digest, so a run is reproducible and nothing
#   of ORT becomes part of Legattice.
#
#   One job per package manager, in parallel. ORT keys each scope
#   by project name and version but not by package manager, so two
#   projects of the same name and version (Lattice: Cargo "lattice"
#   0.3.50 and npm "lattice" 0.3.50, both with a "dependencies"
#   scope) collide and ORT stops ("All of the [Cargo, NPM] managers
#   are able to manage 'Cargo' projects"). One manager per run
#   cannot collide; each job gives its own result and SBOM.
################################################################
name: Trial run (ORT)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Public repository to analyse (owner/name)'
        required: true
        default: 'blessia-blessini/lattice'
      ref:
        description: 'Tag, branch or commit'
        required: true
        default: 'v0.3.50'
      package_managers:
        description: 'ORT package managers, comma-separated; one job each'
        required: true
        default: 'Cargo,NPM'
      repository_config:
        description: 'ORT repository configuration in this repo (what is not shipped); empty for none'
        required: false
        default: 'products/lattice/ort.yml'
      scan:
        description: 'Also run ScanCode over every package (slow)'
        type: boolean
        default: false

env:
  # ORT 97.2.0, image "run" (all tools, ScanCode included). Update both together.
  ORT_IMAGE: ghcr.io/oss-review-toolkit/ort@sha256:4095b20baea5f51e60d38d841ca3e60faae828aff5f74ae3ce213aa223948230
  ORT_VERSION: '97.2.0'

jobs:
  # "Cargo, NPM" -> ["Cargo","NPM"] for the matrix of job ort.
  managers:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.split.outputs.list }}
    steps:
    - name: Split the package managers
      id: split
      shell: bash
      env:
        PACKAGE_MANAGERS: ${{ inputs.package_managers }}
      run: |
        set -euo pipefail
        # Plain names only (letters, digits), so the list is valid JSON as written.
        IFS=',' read -ra parts <<< "$PACKAGE_MANAGERS"
        items=()
        for p in "${parts[@]}"; do
          p="${p//[[:space:]]/}"
          [ -n "$p" ] || continue
          [[ "$p" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::bad package manager name: $p"; exit 1; }
          items+=("\"$p\"")
        done
        [ "${#items[@]}" -gt 0 ] || { echo "::error::no package manager given"; exit 1; }
        list="[$(IFS=,; echo "${items[*]}")]"
        echo "list=$list" >> "$GITHUB_OUTPUT"
        echo "$list"

  ort:
    needs: managers
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        manager: ${{ fromJSON(needs.managers.outputs.list) }}
    name: ort (${{ matrix.manager }})
    steps:
    - name: 100. Check out the product
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: product
        persist-credentials: false

    # Legattice itself, for the product's repository configuration.
    - name: 101. Check out Legattice
      uses: actions/checkout@v6
      with:
        path: legattice
        persist-credentials: false

    ################################################################
    # 110 / ORT configuration. skipExcluded: what the repository
    #       configuration excludes (paths, scopes) is not resolved
    #       at all -- the first trial run failed on an unshipped
    #       helper crate under utils/ that ORT could not resolve.
    #       The image runs as user "ort" (uid 1000); the runner's
    #       workspace belongs to uid 1001, so it is made writable.
    ################################################################
    - name: 110. Prepare ORT
      shell: bash
      env:
        MANAGER: ${{ matrix.manager }}
        REPOSITORY_CONFIG: ${{ inputs.repository_config }}
      run: |
        set -euo pipefail
        [[ "$MANAGER" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::bad package manager name"; exit 1; }
        mkdir -p out
        {
          echo 'ort:'
          echo '  analyzer:'
          echo "    enabledPackageManagers: [${MANAGER}]"
          echo '    skipExcluded: true'
          echo '  scanner:'
          echo '    skipExcluded: true'
        } > out/config.yml
        cat out/config.yml
        repo_config_arg=""
        if [ -n "$REPOSITORY_CONFIG" ]; then
          test -f "legattice/$REPOSITORY_CONFIG" || { echo "::error::legattice/$REPOSITORY_CONFIG not found"; exit 1; }
          cp "legattice/$REPOSITORY_CONFIG" out/repository-config.yml
          repo_config_arg="--repository-configuration-file /work/out/repository-config.yml"
          cat out/repository-config.yml
        fi
        echo "REPO_CONFIG_ARG=$repo_config_arg" >> "$GITHUB_ENV"
        chmod -R a+rwX product out
        docker pull --quiet "$ORT_IMAGE"

    - name: 120. Analyze
      shell: bash
      run: |
        set -euo pipefail
        # REPO_CONFIG_ARG is empty or one fixed option with a fixed path (step 110).
        docker run --rm -v "$PWD:/work" "$ORT_IMAGE" --info -c /work/out/config.yml \
          analyze -i /work/product -o /work/out/analyzer -f JSON $REPO_CONFIG_ARG

    - name: 130. Scan (ScanCode)
      if: inputs.scan
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD:/work" "$ORT_IMAGE" --info -c /work/out/config.yml \
          scan -i /work/out/analyzer/analyzer-result.json -o /work/out/scanner -f JSON

    # Also after a failed scan: the report then comes from the analyzer
    # result. Without an analyzer result there is nothing to report.
    - name: 140. Report
      if: (success() || failure()) && hashFiles('out/analyzer/analyzer-result.json') != ''
      shell: bash
      run: |
        set -euo pipefail
        input=out/analyzer/analyzer-result.json
        [ -f out/scanner/scan-result.json ] && input=out/scanner/scan-result.json
        docker run --rm -v "$PWD:/work" "$ORT_IMAGE" --info -c /work/out/config.yml \
          report -i "/work/$input" -o /work/out/report -f CycloneDX,PlainTextTemplate,WebApp

    - name: 150. Upload the results
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ort-${{ env.ORT_VERSION }}-${{ matrix.manager }}
        path: out/
        if-no-files-found: warn
