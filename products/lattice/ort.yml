# ORT repository configuration for Lattice (blessia-blessini/lattice).
# Passed to "ort analyze --repository-configuration-file", so Lattice's own
# repository needs no .ort.yml. Together with "skipExcluded: true" the
# analyzer does not even resolve what is excluded here.
#
# Excluded = not shipped in Lattice's installers. Kept: everything the app
# links or bundles, and Cargo build-dependencies (they run while the app is
# built, and Lattice's own licence gate counts them as shipped too).
excludes:
  paths:
  - pattern: "utils/**"
    reason: "BUILD_TOOL_OF"
    comment: "Small Rust helpers for the build (build number, changelog); not part of any installer."
  # ORT finds package managers by itself (scan.yml); without this its
  # GitHubAction manager would list the CI's actions as packages.
  - pattern: ".github/**"
    reason: "BUILD_TOOL_OF"
    comment: "CI workflows and the GitHub Actions they use; not part of any installer."
  # Lattice's own files that are not in any installer. Without these the scan
  # of Lattice's repository reports the licence texts of its generated notices,
  # its lockfile and the fixtures of its own licence tests (made-up holders
  # such as "Jane Doe") as if they were Lattice's code.
  - pattern: "THIRD-PARTY-NOTICES.md"
    reason: "OTHER"
    comment: "Generated from the packages it lists; their licences are reported with each package."
  - pattern: "src/lib/export-notices.generated.txt"
    reason: "OTHER"
    comment: "Generated notices embedded in exported documents; their licences are reported with each package."
  - pattern: "README.md"
    reason: "DOCUMENTATION_OF"
    comment: "Describes Lattice and its licensing; Lattice's own licence is LICENSE."
  - pattern: "CHANGELOG.md"
    reason: "DOCUMENTATION_OF"
    comment: "Release history."
  - pattern: "CLA.md"
    reason: "DOCUMENTATION_OF"
    comment: "Contributor licence agreement."
  - pattern: "CONTRIBUTING.md"
    reason: "DOCUMENTATION_OF"
    comment: "How to contribute."
  - pattern: "package-lock.json"
    reason: "BUILD_TOOL_OF"
    comment: "Lockfile; names the packages' licences, contains no code."
  - pattern: "scripts/**"
    reason: "BUILD_TOOL_OF"
    comment: "Build, test and licence-gate scripts."
  - pattern: "foss/**"
    reason: "BUILD_TOOL_OF"
    comment: "Licence policy and records for Lattice's own licence gate."
  - pattern: ".githooks/**"
    reason: "BUILD_TOOL_OF"
    comment: "Git hooks for contributors."
  - pattern: "docs/**"
    reason: "DOCUMENTATION_OF"
    comment: "Requirements and architecture documents."
  - pattern: "src/test/**"
    reason: "TEST_OF"
    comment: "Front-end test helpers."
  - pattern: "**/*.test.*"
    reason: "TEST_OF"
    comment: "Unit tests next to the code they test."
  - pattern: "src-tauri/tests/**"
    reason: "TEST_OF"
    comment: "Rust integration tests."
  - pattern: "src-tauri/examples/**"
    reason: "TEST_OF"
    comment: "Export check programs run by CI."
  - pattern: "_test_samples/**"
    reason: "TEST_OF"
    comment: "Sample documents for tests."
  scopes:
  # Pattern is a regular expression on the scope name: npm "devDependencies"
  # and Cargo "dev-dependencies".
  - pattern: "(?i)dev[_-]?dependencies"
    reason: "DEV_DEPENDENCY_OF"
    comment: "Development and test tools only; never shipped."
